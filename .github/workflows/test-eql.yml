name: "Test EQL"
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-eql.yml"
      - "src/**/*.sql"
      - "sql/**/*.sql"
      - "tests/**/*"
      - "tasks/**/*"

  pull_request:
    # run on all pull requests
    paths:
      - ".github/workflows/test-eql.yml"
      - "src/**/*.sql"
      - "sql/**/*.sql"
      - "tests/**/*"
      - "tasks/**/*"

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MISE_VERBOSE: "1"

defaults:
  run:
    shell: bash -l {0}

permissions:
  contents: read

jobs:
  schema:
    name: "JSON Schema validation"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.4.0
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/sqlx
          shared-key: sqlx-tests

      - name: Validate v2.2 / v2.3 payload schemas
        run: |
          mise run test:schema

  codegen:
    name: "Encrypted-domain codegen"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.4.0
          install: true
          cache: true

      - name: Run codegen generator + drift tests
        run: |
          mise run test:codegen

  matrix-coverage:
    name: "Matrix coverage inventory"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.4.0
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/sqlx
          shared-key: sqlx-tests

      # Regenerate the matrix test-name inventory with the SAME pinned feature
      # set the local task uses (`--no-default-features`, scale excluded), then
      # fail if it differs from the committed snapshot. A coverage change shows
      # up as added/removed names in the PR diff — e.g. emptying `ord_domains`
      # drops ~140 names, impossible to miss in review. No Postgres needed:
      # `--list` only enumerates, the suite uses runtime queries.
      - name: Regenerate and verify the matrix test-name inventory
        run: |
          mise run test:matrix:inventory
          git diff --exit-code -- tests/sqlx/snapshots/int4_matrix_tests.txt \
            || { echo "Coverage inventory stale — run 'mise run test:matrix:inventory' and commit."; exit 1; }

  test:
    name: "Test & Validate EQL (Postgres ${{ matrix.postgres-version }})"
    runs-on: ubuntu-latest-m
    needs: [schema, codegen]

    strategy:
      fail-fast: false
      matrix:
        postgres-version: [17, 16, 15, 14]

    env:
      POSTGRES_VERSION: ${{ matrix.postgres-version }}
      # CS_* are required for `mise run test:sqlx` to regenerate the
      # cipherstash-client-encrypted fixtures before the suite runs.
      # This repository does not accept fork PRs, so the secrets-on-
      # `pull_request` constraint that breaks the fork CI flow does not
      # apply here — leave the env block unconditional.
      CS_CLIENT_ACCESS_KEY: ${{ secrets.CS_CLIENT_ACCESS_KEY }}
      CS_WORKSPACE_CRN: ${{ secrets.CS_WORKSPACE_CRN }}
      CS_CLIENT_ID: ${{ secrets.CS_CLIENT_ID }}
      CS_CLIENT_KEY: ${{ secrets.CS_CLIENT_KEY }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.4.0
          install: true # [default: true] run `mise install`
          cache: true # [default: true] cache mise using GitHub's cache

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/sqlx
          shared-key: sqlx-tests

      - name: Setup database (Postgres ${{ matrix.postgres-version }})
        run: |
          mise run postgres:up postgres-${POSTGRES_VERSION} --extra-args "--detach --wait"

      - name: Validate SQL documentation (Postgres ${{ matrix.postgres-version }})
        run: |
          mise run docs:validate

      - name: Test EQL for Postgres ${{ matrix.postgres-version }}
        run: |
          export active_rust_toolchain=$(rustup show active-toolchain | cut -d' ' -f1)
          rustup component add --toolchain ${active_rust_toolchain} rustfmt clippy
          mise run --output prefix test --postgres ${POSTGRES_VERSION}

  splinter:
    name: "Supabase splinter"
    runs-on: ubuntu-latest-m

    env:
      POSTGRES_VERSION: "17"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          version: 2026.4.0
          install: true
          cache: true

      - name: Setup database
        run: |
          mise run postgres:up postgres-${POSTGRES_VERSION} --extra-args "--detach --wait"

      - name: Build and install EQL
        run: |
          mise run --output prefix --force build
          cat release/cipherstash-encrypt.sql \
            | docker exec -i postgres-${POSTGRES_VERSION} \
                psql -v ON_ERROR_STOP=1 \
                  postgresql://cipherstash:password@localhost/cipherstash -f-

      - name: Run splinter
        run: |
          mise run --output prefix test:splinter --postgres ${POSTGRES_VERSION}


