services:
  postgres: &postgres
    container_name: postgres
    image: postgres:17
    # max_locks_per_transaction is raised well above the default 64 because the
    # eql_v3 surface (now including native-spelling alias families + cross-name
    # operators) creates thousands of objects; concurrent #[sqlx::test]
    # install/uninstall transactions each `DROP SCHEMA ... CASCADE` over that
    # surface and would otherwise exhaust the cluster-wide shared lock table.
    command: postgres -c track_functions=all -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_locks_per_transaction=1024
    ports:
      - 7432:7432
    environment:
      - PGPORT=${POSTGRES_PORT:-7432}
      - PGUSER=${POSTGRES_USER:-cipherstash}
      - POSTGRES_DB=${POSTGRES_DB:-cipherstash}
      - POSTGRES_USER=${POSTGRES_USER:-cipherstash}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    networks:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: 2048mb
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-17:
    <<: *postgres
    image: postgres:17
    container_name: postgres-17
    #volumes: # uncomment if you need to inspect the container contents
    #- ./pg/data-17:/var/lib/postgresql/data

  postgres-16:
    <<: *postgres
    image: postgres:16
    container_name: postgres-16

  postgres-15:
    <<: *postgres
    image: postgres:15
    container_name: postgres-15

  postgres-14:
    <<: *postgres
    image: postgres:14
    container_name: postgres-14

networks:
  postgres:
    driver: bridge

