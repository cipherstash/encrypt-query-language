services:
  postgres: &postgres
    container_name: postgres
    image: postgres:17
    # max_locks_per_transaction: the lock table is sized once at startup as
    # max_locks_per_transaction * max_connections and shared cluster-wide. A
    # full-surface teardown — the shipped uninstaller's `DROP SCHEMA eql_v3
    # CASCADE`, or `DROP OWNED BY <role> CASCADE` in the NOSUPERUSER install
    # tests — takes ONE lock per dropped object, held until commit. Measured on
    # the shipped installer: the uninstaller takes 6,433 locks (the eql_v3
    # functions, plus the ~3k operators that live in public and cascade off
    # them) against the 6,400 the default (64) affords for the WHOLE cluster.
    # A lone teardown survives only because Postgres grows the table into spare
    # shared memory; nextest runs the suite 16-way parallel on CI, so
    # overlapping teardowns exhaust it ("out of shared memory / You might need
    # to increase max_locks_per_transaction"). Measured: 4 concurrent real
    # uninstalls fail 3/4 at the default and 0/4 here. 1024 gives 102.4k slots
    # — headroom for 16 concurrent teardowns of a surface that grows with every
    # new domain family — for ~30MB of shared memory. Creation is unaffected:
    # CREATE takes no per-object lock (3 locks to create 3,000 functions).
    command: postgres -c track_functions=all -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_locks_per_transaction=1024
    ports:
      - 7432:7432
    environment:
      - PGPORT=${POSTGRES_PORT:-7432}
      - PGUSER=${POSTGRES_USER:-cipherstash}
      - POSTGRES_DB=${POSTGRES_DB:-cipherstash}
      - POSTGRES_USER=${POSTGRES_USER:-cipherstash}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    networks:
      - postgres
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: 2048mb
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-17:
    <<: *postgres
    image: postgres:17
    container_name: postgres-17
    #volumes: # uncomment if you need to inspect the container contents
    #- ./pg/data-17:/var/lib/postgresql/data

  postgres-16:
    <<: *postgres
    image: postgres:16
    container_name: postgres-16

  postgres-15:
    <<: *postgres
    image: postgres:15
    container_name: postgres-15

  postgres-14:
    <<: *postgres
    image: postgres:14
    container_name: postgres-14

networks:
  postgres:
    driver: bridge

