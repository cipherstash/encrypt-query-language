[package]
name = "eql_tests"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "chrono", "rust_decimal"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
jsonschema = { version = "0.46.4", default-features = false }
cipherstash-client = { version = "0.35", features = ["tokio"] }
# chrono is already in the tree transitively (cipherstash-client / ore-rs); pin
# it as a direct dependency so the harness can name `chrono::NaiveDate` for the
# `date` scalar (Encode/Decode/Type come from the sqlx `chrono` feature above).
chrono = { version = "0.4", default-features = false }
# rust_decimal backs the `numeric` scalar. The sqlx `rust_decimal` feature above
# provides Encode/Decode/Type<Postgres>; this names the type directly for the
# harness impls (scalar_domains.rs, eql_plaintext.rs). Already in the tree
# transitively (cipherstash-client / ore-rs).
rust_decimal = "1"
paste = "1"
eql-scalars = { path = "../../crates/eql-scalars" }
eql-tests-macros = { path = "../../crates/eql-tests-macros" }

[dev-dependencies]
# None needed - tests live in this crate

[lints]
workspace = true

[features]
default = []
# Opt-in to slow benchmark / regression / scale tests. Without this feature
# they're #[ignore]'d so PR CI stays fast. The `bench-eql` workflow enables
# it on push to main and on a nightly schedule. Run locally with:
#   mise run test:bench
bench = []
# Opt-in to the matrix's per-(variant, index) scale tests. Each builds
# ~5000 rows of filler plus a single selective pivot and asserts the
# planner *prefers* the functional index with `enable_seqscan` left on.
# The default index tests force seqscan off and only prove the index is
# *usable*. Off by default to keep `mise run test` fast; CI runs with
# `--features scale`.
scale = []
# Opt-in to compiling the fixture generators. Without this feature the
# `#[cfg(feature = "fixture-gen")]` generator tests do not exist, so
# `cargo test` and CI never see them. Generators need a live Postgres and,
# in the process env, BOTH a ZeroKMS auth credential (`CS_CLIENT_ACCESS_KEY`
# + `CS_WORKSPACE_CRN`, via AutoStrategy) AND a client key (`CS_CLIENT_ID` +
# `CS_CLIENT_KEY`, via EnvKeyProvider) — the two pairs are not alternatives.
# Regenerate all fixtures with:
#   mise run fixture:generate:all
fixture-gen = []
