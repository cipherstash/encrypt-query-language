[settings]
# Config for test environments
# Can be invoked with: mise --env tcp run <task>
# trusted_config_paths = [
#     "./tests/mise.toml",
#     "./tests/mise.tcp.toml",
#     "./tests/mise.tls.toml",
# ]

[tools]
"rust" = { version = "latest", components = "rustc,rust-std,cargo,rustfmt,rust-docs,clippy" }
"cargo:cargo-binstall" = "latest"
"cargo:sqlx-cli" = "latest"
# Installed via the already-present cargo-binstall (fast in CI). Drives the
# sharded sqlx suite: `cargo nextest archive` builds the test binaries once and
# `cargo nextest run --partition hash:K/N` runs a stable hash-partitioned shard.
"cargo:cargo-nextest" = "latest"
# Single source of truth for the cargo-expand version used by `test:matrix:expand`.
# Pinned in lockstep with the nightly date in that task: cargo-expand drives the
# rustfmt pass, so an unpinned version can drift the matrix snapshot even with a
# frozen macro + nightly. mise installs this for both local runs and CI (the
# macro-expand-eql.yml workflow's mise-action step), so there is no separate
# hardcoded version to keep in lockstep.
"cargo:cargo-expand" = "1.0.122"
# Still required by the documentation tooling (`tasks/docs/generate/*.py`, run
# by `docs:generate:markdown` in the release workflow). The encrypted-domain
# codegen toolchain is now Rust (eql-scalars/eql-codegen) and needs no Python.
"python" = "3.13"

[task_config]
includes = ["tasks", "tasks/postgres.toml", "tasks/fixtures.toml"]

[env]
POSTGRES_DB = "cipherstash"
POSTGRES_USER = "cipherstash"
POSTGRES_PASSWORD = "password"
POSTGRES_HOST = "localhost"
POSTGRES_PORT = "7432"
DATABASE_URL = "postgresql://cipherstash:password@localhost:7432/cipherstash"

[tasks."clean"]
alias = 'k'
description = "Clean release"
run = """
  rm -f release/cipherstash-encrypt-uninstall.sql
  rm -f release/cipherstash-encrypt.sql
"""

[tasks."test:sqlx:prep"]
description = "Prepare the SQLx test DB: cp built EQL into migrations, migrate, regenerate fixtures"
# `build` produces release/cipherstash-encrypt.sql, which is then cp'd into
# tests/sqlx/migrations/001_install_eql.sql below. Without this dep, a stale
# release artifact silently ships an old EQL extension into the test DB and
# regression-guard migrations (e.g. 003_install_ste_vec_data.sql) fail.
depends = ["build"]
dir = "{{config_root}}"
run = """
# Copy built SQL to SQLx migrations (EQL install is generated, not static)
echo "Updating SQLx migrations with built EQL..."
cp release/cipherstash-encrypt.sql tests/sqlx/migrations/001_install_eql.sql

# Run SQLx migrations and tests
echo "Running SQLx migrations..."
cd tests/sqlx
sqlx migrate run

# Regenerate fixtures every run — they are not committed (see .gitignore).
# fixture:generate:all iterates eql-scalars::CATALOG and generates every
# scalar fixture in one process, so new scalar types are picked up
# automatically (add the catalog row + the fixture wiring) without editing
# this task.
# Generator encrypts via cipherstash-client directly, which needs BOTH a
# ZeroKMS auth credential (CS_CLIENT_ACCESS_KEY + CS_WORKSPACE_CRN, via
# AutoStrategy) AND a client key (CS_CLIENT_ID + CS_CLIENT_KEY, via
# EnvKeyProvider) in the shell environment. Auth and key material are
# separate roles — the two pairs are not alternatives.
echo "Regenerating SQLx fixtures..."
cd "{{config_root}}"
mise run fixture:generate:all
"""

[tasks."test:sqlx"]
description = "Run SQLx tests with hybrid migration approach"
# Prep (build + cp + migrate + fixtures) is shared with test:sqlx:watch.
depends = ["test:sqlx:prep"]
dir = "{{config_root}}/tests/sqlx"
run = """
echo "Running Rust tests..."
cargo test
"""

[tasks."test:sqlx:watch"]
description = "Run SQLx tests in watch mode (rebuild EQL on changes)"
# Same prep as test:sqlx so watch mode starts from a migrated DB + fresh
# fixtures, not a stale checkout.
depends = ["test:sqlx:prep"]
dir = "{{config_root}}/tests/sqlx"
run = """
cargo watch -x test
"""

[tasks."test:schema"]
description = "Validate sample payloads against the v2.2 / v2.3 JSON Schemas (no database required)"
dir = "{{config_root}}/tests/sqlx"
run = """
cargo test --test payload_schema_tests
"""

[tasks."codegen:parity"]
description = "Parity gate: Rust eql-codegen output matches the int4 reference SQL files (byte-for-byte)"
dir = "{{config_root}}"
run = "bash tasks/codegen-parity.sh"

[tasks."test:codegen"]
description = "Run the encrypted-domain catalog + generator tests (no database required)"
dir = "{{config_root}}"
run = """
cargo test -p eql-scalars -p eql-codegen
"""

[tasks."test:crates"]
description = "Compile, lint and test the std-only Rust workspace crates (no database)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
# eql-scalars / eql-codegen / eql-tests-macros are the lean workspace members.
# Scope explicitly to them (NOT --workspace): a workspace-wide test would drag
# in tests/sqlx, whose suite needs Postgres + CS_* secrets and is already
# covered by the `test` job. eql-tests-macros only pulls syn/quote/proc-macro2,
# so it stays in the lean set. clippy is likewise scoped — a workspace clippy
# recompiles the heavy sqlx/tokio/cipherstash-client tree for no added coverage
# of these crates.
# bash is pinned via the `#!/usr/bin/env bash` shebang above (mise honors a
# `#!` first line), so `set -o pipefail` is available regardless of the runner's
# /bin/sh (dash on the CI images).
set -euo pipefail
cargo fmt --check
cargo clippy -p eql-scalars -p eql-codegen -p eql-tests-macros --all-targets -- -D warnings
cargo test -p eql-scalars -p eql-codegen -p eql-tests-macros
"""

[tasks."test:matrix:inventory"]
description = "Verify the matrix test-name set against the single canonical snapshot (or its derived eq-only subset), catalog-cross-checked (no database required)"
dir = "{{config_root}}/tests/sqlx"
run = """
#!/usr/bin/env bash
# ONE canonical, token-normalized snapshot (snapshots/matrix_tests.txt) pins the
# set of macro-emitted matrix test names for the ORDERED scalar shape. There is
# no second committed file for the equality-only shape: an eq-only type's name
# set is exactly the ordered set MINUS the ord-only lines, so the inventory
# DERIVES it from the one baseline (ordered minus `_ord`/`order_by`/
# `routes_through_ob`). Each discovered type must match either the full baseline
# (ordered) or that derived subset (eq-only). This keeps one committed snapshot
# however many ordered/eq-only types exist.
#
# Steps:
#   1. List the encrypted_domain binary ONCE (deterministic; reused below).
#   2. Discover the set of scalar types present FROM THE BINARY'S OWN OUTPUT
#      (scalars::<X>:: prefixes) — never a directory glob.
#   3. For each discovered type, normalize its token to <T> and assert its set
#      equals EITHER the canonical snapshot (ordered) OR the derived eq-only
#      subset. Assert at least one type is present.
#   4. Completeness cross-check: assert the discovered type set equals
#      `eql-codegen list-types`. A catalog type added without its matrix wiring
#      (no scalars::<T>:: tests in the binary) fails here.
#
# `--no-default-features` excludes the `scale` arm (a known, documented blind
# spot, covered by the scale gate + family::mutations negative controls).
# `LC_ALL=C sort` makes ordering byte-stable across locales. No database needed.
set -euo pipefail

test -f snapshots/matrix_tests.txt || { echo "snapshots/matrix_tests.txt missing — regenerate (see snapshots/README.md)." >&2; exit 1; }
test -f snapshots/matrix_tests_eq_only.txt || { echo "snapshots/matrix_tests_eq_only.txt missing — regenerate (see snapshots/README.md)." >&2; exit 1; }

listing=$(cargo test --no-default-features --test encrypted_domain -- --list | sed -n 's/: test$//p')

# Types present in the binary, from scalars::<X>:: prefixes.
discovered=$(printf '%s\\n' "$listing" \
  | sed -n 's/^scalars::\\([a-z0-9_]*\\)::.*/\\1/p' \
  | LC_ALL=C sort -u)
[ -n "$discovered" ] || { echo "No scalars::<X>:: tests found in the encrypted_domain binary." >&2; exit 1; }

# An equality-only type (no `_ord` domain) emits a strict SUBSET of the
# canonical (ordered) snapshot: the same names minus every ord-only line
# (`_ord` / `order_by` / `routes_through_ob`). Derive that subset once into a
# file, so an equality-only scalar (e.g. timestamptz) needs NO second committed
# snapshot — it is validated against this derivation from the single baseline.
# Materialise to a file (not a shell variable) so both shapes compare via the
# same `cmp`/`diff` path: a variable would strip trailing newlines on capture
# and force the failure diff to reconstruct the string with `printf`.
eq_only_expected="/tmp/matrix-eq-only-expected.txt"
grep -vE '_ord|order_by|routes_through_ob' snapshots/matrix_tests.txt | LC_ALL=C sort -u > "$eq_only_expected"

# Pin the derivation: the runtime-derived eq-only set must equal the COMMITTED
# snapshot. This closes the blind spot where the strip filter (or a new ordered
# test name that the filter wrongly keeps/drops) silently changes what the
# eq-only gate accepts — any such change now diffs against a committed artifact
# and must be re-committed deliberately.
if ! cmp -s "$eq_only_expected" snapshots/matrix_tests_eq_only.txt; then
  echo "Derived eq-only set differs from committed snapshots/matrix_tests_eq_only.txt." >&2
  echo "If the ordered baseline changed intentionally, regenerate the eq-only snapshot:" >&2
  echo "  grep -vE '_ord|order_by|routes_through_ob' snapshots/matrix_tests.txt | LC_ALL=C sort -u > snapshots/matrix_tests_eq_only.txt" >&2
  diff snapshots/matrix_tests_eq_only.txt "$eq_only_expected" >&2 || true
  exit 1
fi

# Per-type normalize + compare: each type must match EITHER the full canonical
# snapshot (ordered shape) OR the derived eq-only subset (equality-only shape).
checked=0
while IFS= read -r t; do
  [ -n "$t" ] || continue
  printf '%s\\n' "$listing" | grep "^scalars::${t}::" \
    | sed -e "s/^scalars::${t}::/scalars::<T>::/" -e "s/_${t}_/_<T>_/g" | LC_ALL=C sort > "/tmp/matrix-norm-${t}.txt"
  if cmp -s "/tmp/matrix-norm-${t}.txt" snapshots/matrix_tests.txt; then
    shape="ordered"
  elif cmp -s "/tmp/matrix-norm-${t}.txt" "$eq_only_expected"; then
    shape="eq_only"
  else
    echo "Matrix test-name set for '${t}' matches NEITHER the canonical snapshot nor its derived eq-only subset." >&2
    echo "  vs ordered (snapshots/matrix_tests.txt):" >&2
    diff snapshots/matrix_tests.txt "/tmp/matrix-norm-${t}.txt" >&2 || true
    echo "  vs derived eq-only (ordered minus _ord/order_by/routes_through_ob):" >&2
    diff "$eq_only_expected" "/tmp/matrix-norm-${t}.txt" >&2 || true
    exit 1
  fi
  echo "  ${t}: ${shape}"
  checked=$((checked + 1))
done <<< "$discovered"
[ "$checked" -gt 0 ] || { echo "No scalar type matched the canonical snapshot or its derived eq-only subset." >&2; exit 1; }

# Completeness cross-check against the catalog (the single source of truth).
catalog=$(cd "{{config_root}}" && cargo run -p eql-codegen -- list-types | LC_ALL=C sort -u)
if [ "$discovered" != "$catalog" ]; then
  echo "Catalog types and matrix-wired types disagree." >&2
  echo "  catalog (eql-codegen list-types): $(echo "$catalog" | tr '\\n' ' ')" >&2
  echo "  matrix-wired (binary --list):     $(echo "$discovered" | tr '\\n' ' ')" >&2
  echo "A catalog type missing its matrix wiring (or a wired type not in the catalog) trips this." >&2
  exit 1
fi

echo "Matrix inventory OK: ${checked} type(s) match the canonical snapshot or its derived eq-only subset; catalog reconciled."
"""

[tasks."test:matrix:expand"]
description = "Regenerate the int4 matrix cargo-expand snapshot (requires the pinned nightly + cargo-expand)"
dir = "{{config_root}}/tests/sqlx"
run = """
#!/usr/bin/env bash
# Body-level fidelity backstop for the macro: the expanded source of the int4
# matrix arms. The `cargo +nightly-...` invocation below is the SINGLE source of
# the pinned nightly date — .github/workflows/macro-expand-eql.yml greps it from
# here rather than hardcoding, so there is nothing to keep in lockstep. The date
# is pinned to a known-good value so the snapshot only moves when *the macro*
# moves, not when nightly reformats — bump it deliberately, here, in one place.
#
# `#[sqlx::test]` embeds one `sqlx::migrate::Migration` per file in migrations/
# plus the fixture (via include_str) into EVERY generated test — ~477 MB of
# repeated data dwarfing the macro bodies, and non-deterministic across
# environments (the generated 001_install_eql.sql is absent in a bare checkout).
# Normalise both to fixed empties so the snapshot depends only on matrix.rs +
# the sqlx/test harness: swap migrations/ for a single empty placeholder and
# empty the int4 fixture, expand, then restore (trap fires on any exit). This is
# expand-only surgery on gitignored/generated inputs; nothing here is committed.
#
# Non-blocking lane (no Postgres, never compiled): the `.rs` name lives under
# snapshots/, not tests/, so Cargo never treats it as a test target.
set -euo pipefail
# Force the mise-pinned cargo-expand (mise.toml [tools]) to win over any stray
# global `cargo install cargo-expand` in ~/.cargo/bin, which otherwise sits
# ahead of mise's install dir on PATH and silently drifts the snapshot. The
# version is single-sourced in [tools]; this only fixes PATH precedence.
PATH="$(mise where cargo:cargo-expand)/bin:$PATH"
export PATH
mkdir -p snapshots fixtures
BK=$(mktemp -d)
cp -a migrations "$BK/migrations"
# The int4 fixture is gitignored (regenerated) and absent in a bare checkout —
# back it up only if present, and on restore drop the empty stand-in if so.
HAD_FIXTURE=0
if [ -f fixtures/eql_v2_int4.sql ]; then cp -a fixtures/eql_v2_int4.sql "$BK/eql_v2_int4.sql"; HAD_FIXTURE=1; fi
restore() {
  rm -rf migrations && cp -a "$BK/migrations" migrations
  if [ "$HAD_FIXTURE" = 1 ]; then cp -af "$BK/eql_v2_int4.sql" fixtures/eql_v2_int4.sql; else rm -f fixtures/eql_v2_int4.sql; fi
  rm -rf "$BK"
}
trap restore EXIT
# Wipe + recreate so the expand input is ALWAYS exactly one empty migration +
# one empty fixture, regardless of what the checkout had — this is what makes
# the snapshot deterministic across local and CI.
rm -rf migrations && mkdir migrations
: > migrations/0001_placeholder.sql
: > fixtures/eql_v2_int4.sql
# Expand into a temp file and mv into place only on success — a redirect straight
# onto the snapshot would zero it before cargo runs, so a transient expand
# failure would leave a 0-byte snapshot locally. (Under `set -euo pipefail` a
# cargo failure aborts the script and the trap restores migrations/fixtures; the
# temp file is then orphaned in $TMPDIR, which is acceptable.)
OUT=$(mktemp)
cargo +nightly-2026-05-01 expand --test encrypted_domain scalars::int4 > "$OUT"
mv "$OUT" snapshots/int4_expanded.rs
"""
