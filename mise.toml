[settings]
# Config for test environments
# Can be invoked with: mise --env tcp run <task>
# trusted_config_paths = [
#     "./tests/mise.toml",
#     "./tests/mise.tcp.toml",
#     "./tests/mise.tls.toml",
# ]

[tools]
"rust" = { version = "latest", components = "rustc,rust-std,cargo,rustfmt,rust-docs,clippy" }
"cargo:cargo-binstall" = "latest"
"cargo:sqlx-cli" = "latest"
# Single source of truth for the cargo-expand version used by `test:matrix:expand`.
# Pinned in lockstep with the nightly date in that task: cargo-expand drives the
# rustfmt pass, so an unpinned version can drift the matrix snapshot even with a
# frozen macro + nightly. mise installs this for both local runs and CI (the
# macro-expand-eql.yml workflow's mise-action step), so there is no separate
# hardcoded version to keep in lockstep.
"cargo:cargo-expand" = "1.0.122"
"python" = "3.13"

[task_config]
includes = ["tasks", "tasks/postgres.toml", "tasks/fixtures.toml"]

[env]
POSTGRES_DB = "cipherstash"
POSTGRES_USER = "cipherstash"
POSTGRES_PASSWORD = "password"
POSTGRES_HOST = "localhost"
POSTGRES_PORT = "7432"
DATABASE_URL = "postgresql://cipherstash:password@localhost:7432/cipherstash"

[tasks."clean"]
alias = 'k'
description = "Clean release"
run = """
  rm -f release/cipherstash-encrypt-uninstall.sql
  rm -f release/cipherstash-encrypt.sql
"""

[tasks."test:sqlx"]
description = "Run SQLx tests with hybrid migration approach"
# `build` produces release/cipherstash-encrypt.sql, which is then cp'd into
# tests/sqlx/migrations/001_install_eql.sql below. Without this dep, a stale
# release artifact silently ships an old EQL extension into the test DB and
# regression-guard migrations (e.g. 003_install_ste_vec_data.sql) fail.
depends = ["build"]
dir = "{{config_root}}"
run = """
# Copy built SQL to SQLx migrations (EQL install is generated, not static)
echo "Updating SQLx migrations with built EQL..."
cp release/cipherstash-encrypt.sql tests/sqlx/migrations/001_install_eql.sql

# Run SQLx migrations and tests
echo "Running SQLx migrations..."
cd tests/sqlx
sqlx migrate run

# Regenerate fixtures every run — they are not committed (see .gitignore).
# fixture:generate:all enumerates every scalar manifest in
# tasks/codegen/types/ that declares a [fixture] table, so new scalar types
# are picked up automatically without editing this task.
# Generator encrypts via cipherstash-client directly, which needs BOTH a
# ZeroKMS auth credential (CS_CLIENT_ACCESS_KEY + CS_WORKSPACE_CRN, via
# AutoStrategy) AND a client key (CS_CLIENT_ID + CS_CLIENT_KEY, via
# EnvKeyProvider) in the shell environment. Auth and key material are
# separate roles — the two pairs are not alternatives.
echo "Regenerating SQLx fixtures..."
cd "{{config_root}}"
mise run fixture:generate:all

echo "Running Rust tests..."
cd tests/sqlx
cargo test
"""

[tasks."test:sqlx:watch"]
description = "Run SQLx tests in watch mode (rebuild EQL on changes)"
dir = "{{config_root}}/tests/sqlx"
run = """
cargo watch -x test
"""

[tasks."test:schema"]
description = "Validate sample payloads against the v2.2 / v2.3 JSON Schemas (no database required)"
dir = "{{config_root}}/tests/sqlx"
run = """
cargo test --test payload_schema_tests
"""

[tasks."codegen:domain:all"]
description = "Regenerate every encrypted-domain type from its TOML manifest"
dir = "{{config_root}}"
run = """
mise exec python -- python -m tasks.codegen.generate --all
"""

[tasks."test:codegen"]
description = "Run the encrypted-domain codegen generator tests (no database required)"
dir = "{{config_root}}"
run = """
# pytest is the only non-stdlib dependency; the install is a fast no-op once satisfied.
mise exec python -- python -m pip install --quiet --disable-pip-version-check pytest
mise exec python -- python -m pytest tasks/codegen -q
"""

[tasks."test:matrix:inventory"]
description = "Regenerate the int4/int2 matrix test-name inventory snapshots (no database required)"
dir = "{{config_root}}/tests/sqlx"
run = """
# Pin an explicit feature set so the inventory is deterministic regardless of
# the caller's local flags. `--no-default-features` keeps the `scale` arm
# (`#[cfg(feature = "scale")]`) excluded — its add/delete is a known blind spot
# of this default-feature inventory, covered instead by the scale gate + the
# family::mutations negative controls. `--list` enumerates the whole
# encrypted_domain binary (family::support, family::inlinability,
# family::mutations, scalars::int4, scalars::int2); the per-scalar `grep`
# scopes each snapshot to that matrix only, so landing other family tests
# never dirties it. `LC_ALL=C sort` makes ordering byte-stable across locales
# (a bare `sort` is locale-dependent and yields spurious CI diffs).
set -euo pipefail
mkdir -p snapshots
cargo test --no-default-features --test encrypted_domain -- --list |
  sed -n 's/: test$//p' |
  grep '^scalars::int4' |
  LC_ALL=C sort > snapshots/int4_matrix_tests.txt
cargo test --no-default-features --test encrypted_domain -- --list |
  sed -n 's/: test$//p' |
  grep '^scalars::int2' |
  LC_ALL=C sort > snapshots/int2_matrix_tests.txt
"""

[tasks."test:matrix:expand"]
description = "Regenerate the int4 matrix cargo-expand snapshot (requires the pinned nightly + cargo-expand)"
dir = "{{config_root}}/tests/sqlx"
run = """
# Body-level fidelity backstop for the macro: the expanded source of the int4
# matrix arms. The `cargo +nightly-...` invocation below is the SINGLE source of
# the pinned nightly date — .github/workflows/macro-expand-eql.yml greps it from
# here rather than hardcoding, so there is nothing to keep in lockstep. The date
# is pinned to a known-good value so the snapshot only moves when *the macro*
# moves, not when nightly reformats — bump it deliberately, here, in one place.
#
# `#[sqlx::test]` embeds one `sqlx::migrate::Migration` per file in migrations/
# plus the fixture (via include_str) into EVERY generated test — ~477 MB of
# repeated data dwarfing the macro bodies, and non-deterministic across
# environments (the generated 001_install_eql.sql is absent in a bare checkout).
# Normalise both to fixed empties so the snapshot depends only on matrix.rs +
# the sqlx/test harness: swap migrations/ for a single empty placeholder and
# empty the int4 fixture, expand, then restore (trap fires on any exit). This is
# expand-only surgery on gitignored/generated inputs; nothing here is committed.
#
# Non-blocking lane (no Postgres, never compiled): the `.rs` name lives under
# snapshots/, not tests/, so Cargo never treats it as a test target.
set -euo pipefail
# Force the mise-pinned cargo-expand (mise.toml [tools]) to win over any stray
# global `cargo install cargo-expand` in ~/.cargo/bin, which otherwise sits
# ahead of mise's install dir on PATH and silently drifts the snapshot. The
# version is single-sourced in [tools]; this only fixes PATH precedence.
PATH="$(mise where cargo:cargo-expand)/bin:$PATH"
export PATH
mkdir -p snapshots fixtures
BK=$(mktemp -d)
cp -a migrations "$BK/migrations"
# The int4 fixture is gitignored (regenerated) and absent in a bare checkout —
# back it up only if present, and on restore drop the empty stand-in if so.
HAD_FIXTURE=0
if [ -f fixtures/eql_v2_int4.sql ]; then cp -a fixtures/eql_v2_int4.sql "$BK/eql_v2_int4.sql"; HAD_FIXTURE=1; fi
restore() {
  rm -rf migrations && cp -a "$BK/migrations" migrations
  if [ "$HAD_FIXTURE" = 1 ]; then cp -af "$BK/eql_v2_int4.sql" fixtures/eql_v2_int4.sql; else rm -f fixtures/eql_v2_int4.sql; fi
  rm -rf "$BK"
}
trap restore EXIT
# Wipe + recreate so the expand input is ALWAYS exactly one empty migration +
# one empty fixture, regardless of what the checkout had — this is what makes
# the snapshot deterministic across local and CI.
rm -rf migrations && mkdir migrations
: > migrations/0001_placeholder.sql
: > fixtures/eql_v2_int4.sql
# Expand into a temp file and mv into place only on success — a redirect straight
# onto the snapshot would zero it before cargo runs, so a transient expand
# failure would leave a 0-byte snapshot locally. (Under `set -euo pipefail` a
# cargo failure aborts the script and the trap restores migrations/fixtures; the
# temp file is then orphaned in $TMPDIR, which is acceptable.)
OUT=$(mktemp)
cargo +nightly-2026-05-01 expand --test encrypted_domain scalars::int4 > "$OUT"
mv "$OUT" snapshots/int4_expanded.rs
"""
