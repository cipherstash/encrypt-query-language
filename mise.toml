[settings]
# Config for test environments
# Can be invoked with: mise --env tcp run <task>
# trusted_config_paths = [
#     "./tests/mise.toml",
#     "./tests/mise.tcp.toml",
#     "./tests/mise.tls.toml",
# ]

[tools]
"rust" = { version = "latest", components = "rustc,rust-std,cargo,rustfmt,rust-docs,clippy" }
"cargo:cargo-binstall" = "latest"
"cargo:sqlx-cli" = "latest"
# Installed via the already-present cargo-binstall (fast in CI). Drives the
# sharded sqlx suite: `cargo nextest archive` builds the test binaries once and
# `cargo nextest run --partition hash:K/N` runs a stable hash-partitioned shard.
"cargo:cargo-nextest" = "latest"
# Single source of truth for the cargo-expand version used by `test:matrix:expand`.
# Pinned in lockstep with the nightly date in that task: cargo-expand drives the
# rustfmt pass, so an unpinned version can drift the matrix snapshot even with a
# frozen macro + nightly. mise installs this for both local runs and CI (the
# macro-expand-eql.yml workflow's mise-action step), so there is no separate
# hardcoded version to keep in lockstep.
"cargo:cargo-expand" = "1.0.122"
# Still required by the documentation tooling (`tasks/docs/generate/*.py`, run
# by `docs:generate:markdown` in the release workflow). The encrypted-domain
# codegen toolchain is now Rust (eql-scalars/eql-codegen) and needs no Python.
"python" = "3.13"

[task_config]
includes = ["tasks", "tasks/postgres.toml", "tasks/fixtures.toml"]

[env]
POSTGRES_DB = "cipherstash"
POSTGRES_USER = "cipherstash"
POSTGRES_PASSWORD = "password"
POSTGRES_HOST = "localhost"
POSTGRES_PORT = "7432"
DATABASE_URL = "postgresql://cipherstash:password@localhost:7432/cipherstash"

[tasks."clean"]
alias = 'k'
description = "Clean release"
run = """
  rm -f release/cipherstash-encrypt-uninstall.sql
  rm -f release/cipherstash-encrypt.sql
"""

[tasks."test:sqlx:prep"]
description = "Prepare the SQLx test DB: cp built EQL into migrations, migrate, regenerate fixtures"
# `build` produces release/cipherstash-encrypt.sql, which is then cp'd into
# tests/sqlx/migrations/001_install_eql.sql below. Without this dep, a stale
# release artifact silently ships an old EQL extension into the test DB and
# regression-guard migrations (e.g. 003_install_ste_vec_data.sql) fail.
depends = ["build"]
dir = "{{config_root}}"
run = """
# Copy built SQL to SQLx migrations (EQL install is generated, not static)
echo "Updating SQLx migrations with built EQL..."
cp release/cipherstash-encrypt.sql tests/sqlx/migrations/001_install_eql.sql

# Run SQLx migrations and tests
echo "Running SQLx migrations..."
cd tests/sqlx
sqlx migrate run

# Regenerate fixtures every run — they are not committed (see .gitignore).
# fixture:generate:all iterates eql-scalars::CATALOG and generates every
# scalar fixture in one process, so new scalar types are picked up
# automatically (add the catalog row + the fixture wiring) without editing
# this task.
# Generator encrypts via cipherstash-client directly, which needs BOTH a
# ZeroKMS auth credential (CS_CLIENT_ACCESS_KEY + CS_WORKSPACE_CRN, via
# AutoStrategy) AND a client key (CS_CLIENT_ID + CS_CLIENT_KEY, via
# EnvKeyProvider) in the shell environment. Auth and key material are
# separate roles — the two pairs are not alternatives.
echo "Regenerating SQLx fixtures..."
cd "{{config_root}}"
mise run fixture:generate:all
"""

[tasks."test:sqlx"]
description = "Run SQLx tests with hybrid migration approach"
# Prep (build + cp + migrate + fixtures) is shared with test:sqlx:watch.
depends = ["test:sqlx:prep"]
dir = "{{config_root}}/tests/sqlx"
run = """
echo "Running Rust tests..."
cargo test
"""

[tasks."test:sqlx:watch"]
description = "Run SQLx tests in watch mode (rebuild EQL on changes)"
# Same prep as test:sqlx so watch mode starts from a migrated DB + fresh
# fixtures, not a stale checkout.
depends = ["test:sqlx:prep"]
dir = "{{config_root}}/tests/sqlx"
run = """
cargo watch -x test
"""

[tasks."test:sqlx:archive"]
description = "Build EQL + compile the sqlx test binaries once into a reusable nextest archive"
# Depends on test:sqlx:prep (NOT just build): `#[sqlx::test(fixtures(scripts(…)))]`
# embeds the per-type fixture SQL AND the 001_install_eql.sql migration into the
# compiled test binaries via `include_str!` at COMPILE time. So the fixtures +
# migration must exist on disk BEFORE `cargo nextest archive` compiles — prep
# produces both (build → cp migration → sqlx migrate → fixture:generate:all).
# Consequence: this task needs a live Postgres + CS_* creds (prep's
# fixture:generate:all prerequisites), so the build-archive CI job runs
# postgres:up and carries the CS_* env. The `#MISE depends` directive in the
# script is inert under `bash tasks/...`, so the dependency MUST be declared here.
depends = ["test:sqlx:prep"]
dir = "{{config_root}}"
run = "bash tasks/test/sqlx-archive.sh"

[tasks."test:sqlx:partition"]
description = "Run one hash partition of the sqlx suite from a prebuilt nextest archive (SHARD / SHARD_TOTAL env)"
dir = "{{config_root}}"
run = "bash tasks/test/sqlx-partition.sh"

[tasks."test:schema"]
description = "Validate sample payloads against the v2.2 / v2.3 JSON Schemas (no database required)"
dir = "{{config_root}}/tests/sqlx"
run = """
cargo test --test payload_schema_tests
"""

[tasks."codegen:parity"]
description = "Parity gate: Rust eql-codegen output matches the int4 reference SQL files (byte-for-byte)"
dir = "{{config_root}}"
run = "bash tasks/codegen-parity.sh"

[tasks."test:codegen"]
description = "Run the encrypted-domain catalog + generator tests (no database required)"
dir = "{{config_root}}"
run = """
cargo test -p eql-scalars -p eql-codegen
"""

[tasks."test:crates"]
description = "Compile, lint and test the std-only Rust workspace crates (no database)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
# eql-scalars / eql-codegen / eql-tests-macros / eql-types are the lean
# workspace members. Scope explicitly to them (NOT --workspace): a
# workspace-wide test would drag in tests/sqlx, whose suite needs Postgres +
# CS_* secrets and is already covered by the `test` job. eql-tests-macros only
# pulls syn/quote/proc-macro2 and eql-types only serde/serde_json/ts-rs, so
# they stay in the lean set. clippy is likewise scoped — a workspace clippy
# recompiles the heavy sqlx/tokio/cipherstash-client tree for no added coverage
# of these crates.
# bash is pinned via the `#!/usr/bin/env bash` shebang above (mise honors a
# `#!` first line), so `set -o pipefail` is available regardless of the runner's
# /bin/sh (dash on the CI images).
set -euo pipefail
cargo fmt --check
cargo clippy -p eql-scalars -p eql-codegen -p eql-tests-macros -p eql-types --all-targets -- -D warnings
cargo test -p eql-scalars -p eql-codegen -p eql-tests-macros -p eql-types
"""

[tasks."types:generate"]
description = "Regenerate eql-types TypeScript bindings and JSON Schemas from the Rust types (no database required)"
dir = "{{config_root}}"
run = """
#!/usr/bin/env bash
# Clean-then-regenerate: ts-rs and tests/export.rs only ever ADD files, so a
# renamed or removed type would otherwise leave an orphaned binding/schema
# behind — we need clean dirs, not an overlay. But we must NOT rm the
# checked-in output before the build: a failing or interrupted `cargo test`
# would then leave the working tree missing it. Instead, export into a
# throwaway temp dir (ts-rs honors TS_RS_EXPORT_DIR; tests/export.rs honors
# EQL_TYPES_SCHEMA_DIR; every type uses the v3/ subdir, so the temp tree
# mirrors crates/eql-types/{bindings,schema} exactly) and only swap it into
# place after the tests succeed. The swap stays out of the tests themselves —
# they run in parallel and can't safely rm.
set -euo pipefail
tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
TS_RS_EXPORT_DIR="$tmp/bindings" EQL_TYPES_SCHEMA_DIR="$tmp/schema" cargo test -p eql-types
rm -rf crates/eql-types/bindings crates/eql-types/schema
mv "$tmp/bindings" crates/eql-types/bindings
mv "$tmp/schema" crates/eql-types/schema
"""

[tasks."types:check"]
description = "Verify the checked-in eql-types bindings/ and schema/ are fresh (regenerate + git diff)"
dir = "{{config_root}}"
depends = ["types:generate"]
run = """
#!/usr/bin/env bash
set -euo pipefail
git diff --exit-code -- crates/eql-types/bindings crates/eql-types/schema || {
  echo "eql-types bindings/ or schema/ are stale — run 'mise run types:generate' and commit the result" >&2
  exit 1
}
# git diff is blind to brand-new files; untracked output is stale too.
untracked=$(git ls-files --others --exclude-standard -- crates/eql-types/bindings crates/eql-types/schema)
if [ -n "$untracked" ]; then
  echo "eql-types has uncommitted generated files:" >&2
  echo "$untracked" >&2
  exit 1
fi
"""

[tasks."test:matrix:inventory"]
description = "Verify the matrix test-name set against the canonical snapshot (its derived eq-only subset, or the committed text superset), catalog-cross-checked (no database required)"
dir = "{{config_root}}/tests/sqlx"
run = """
#!/usr/bin/env bash
# Three committed, token-normalized snapshots. The canonical one
# (snapshots/matrix_tests.txt) pins the set of macro-emitted matrix test names
# for the ORDERED scalar shape. The second (snapshots/matrix_tests_eq_only.txt)
# is the equality-only shape: an eq-only type's name set is exactly the ordered
# set MINUS the ord-only lines (`_ord`/`order_by`/`routes_through_ob`), so it is
# DERIVED from the one baseline — but it is also committed and PINNED: the gate
# re-derives the subset at runtime and asserts it equals the committed file
# (step 3 below), so a change to the baseline or the strip filter that alters the
# eq-only set must be re-committed deliberately. The third
# (snapshots/matrix_tests_text.txt) is the TEXT shape: a SUPERSET of the ordered
# baseline (every ordered arm PLUS the text-only `_search` / `_eqidx` / `_match`
# arms). It is not derivable by a strip filter, so it is committed directly and
# pinned as a strict superset of the baseline. Each discovered type must then
# match the full baseline (ordered), that derived/pinned subset (eq-only), or the
# committed text superset. One baseline drives the ordered/eq-only shapes however
# many types exist.
#
# Steps:
#   1. List the encrypted_domain binary ONCE (deterministic; reused below).
#   2. Discover the set of scalar types present FROM THE BINARY'S OWN OUTPUT
#      (scalars::<X>:: prefixes) — never a directory glob.
#   3. Derive the eq-only subset from the ordered baseline and assert it equals
#      the committed snapshots/matrix_tests_eq_only.txt (pins the derivation).
#   4. For each discovered type, normalize its token to <T> and assert its set
#      equals the canonical snapshot (ordered), the derived eq-only subset, OR
#      the committed text superset. Assert at least one type is present.
#   5. Completeness cross-check: assert the discovered type set equals
#      `eql-codegen list-types`. A catalog type added without its matrix wiring
#      (no scalars::<T>:: tests in the binary) fails here.
#
# `--no-default-features` excludes the `scale` arm (a known, documented blind
# spot, covered by the scale gate + family::mutations negative controls).
# `LC_ALL=C sort` makes ordering byte-stable across locales. No database needed.
set -euo pipefail

test -f snapshots/matrix_tests.txt || { echo "snapshots/matrix_tests.txt missing — regenerate (see snapshots/README.md)." >&2; exit 1; }
test -f snapshots/matrix_tests_eq_only.txt || { echo "snapshots/matrix_tests_eq_only.txt missing — regenerate (see snapshots/README.md)." >&2; exit 1; }
test -f snapshots/matrix_tests_text.txt || { echo "snapshots/matrix_tests_text.txt missing — regenerate (see snapshots/README.md)." >&2; exit 1; }

listing=$(cargo test --no-default-features --test encrypted_domain -- --list | sed -n 's/: test$//p')

# Types present in the binary, from scalars::<X>:: prefixes.
discovered=$(printf '%s\\n' "$listing" \
  | sed -n 's/^scalars::\\([a-z0-9_]*\\)::.*/\\1/p' \
  | LC_ALL=C sort -u)
[ -n "$discovered" ] || { echo "No scalars::<X>:: tests found in the encrypted_domain binary." >&2; exit 1; }

# An equality-only type (no `_ord` domain) emits a strict SUBSET of the
# canonical (ordered) snapshot: the same names minus every ord-only line
# (`_ord` / `order_by` / `routes_through_ob`). Derive that subset once into a
# file, so an equality-only scalar (e.g. timestamptz) needs NO second committed
# snapshot — it is validated against this derivation from the single baseline.
# Materialise to a file (not a shell variable) so both shapes compare via the
# same `cmp`/`diff` path: a variable would strip trailing newlines on capture
# and force the failure diff to reconstruct the string with `printf`.
eq_only_expected="/tmp/matrix-eq-only-expected.txt"
grep -vE '_ord|order_by|routes_through_ob' snapshots/matrix_tests.txt | LC_ALL=C sort -u > "$eq_only_expected"

# Pin the derivation: the runtime-derived eq-only set must equal the COMMITTED
# snapshot. This closes the blind spot where the strip filter (or a new ordered
# test name that the filter wrongly keeps/drops) silently changes what the
# eq-only gate accepts — any such change now diffs against a committed artifact
# and must be re-committed deliberately.
if ! cmp -s "$eq_only_expected" snapshots/matrix_tests_eq_only.txt; then
  echo "Derived eq-only set differs from committed snapshots/matrix_tests_eq_only.txt." >&2
  echo "If the ordered baseline changed intentionally, regenerate the eq-only snapshot:" >&2
  echo "  grep -vE '_ord|order_by|routes_through_ob' snapshots/matrix_tests.txt | LC_ALL=C sort -u > snapshots/matrix_tests_eq_only.txt" >&2
  diff snapshots/matrix_tests_eq_only.txt "$eq_only_expected" >&2 || true
  exit 1
fi

# The text shape is the THIRD committed snapshot: a SUPERSET of the ordered
# baseline (every ordered arm PLUS the text-only `_search` / `_eqidx` / `_match`
# arms). Unlike eq-only it is not derivable by a strip filter, so it is committed
# directly. Pin the superset invariant: every ordered-baseline arm must be
# present in the text shape, so an edit that silently drops a baseline arm for
# text (regressing coverage) is caught here, not just at the per-type compare.
missing_from_text=$(comm -23 <(LC_ALL=C sort snapshots/matrix_tests.txt) <(LC_ALL=C sort snapshots/matrix_tests_text.txt))
if [ -n "$missing_from_text" ]; then
  echo "snapshots/matrix_tests_text.txt is missing ordered-baseline arms (text must be a superset):" >&2
  printf '%s\\n' "$missing_from_text" >&2
  exit 1
fi

# Per-type normalize + compare: each type must match the full canonical snapshot
# (ordered shape), the derived eq-only subset (equality-only shape), or the
# committed text superset (text shape).
checked=0
while IFS= read -r t; do
  [ -n "$t" ] || continue
  printf '%s\\n' "$listing" | grep "^scalars::${t}::" \
    | sed -e "s/^scalars::${t}::/scalars::<T>::/" -e "s/_${t}_/_<T>_/g" | LC_ALL=C sort > "/tmp/matrix-norm-${t}.txt"
  if cmp -s "/tmp/matrix-norm-${t}.txt" snapshots/matrix_tests.txt; then
    shape="ordered"
  elif cmp -s "/tmp/matrix-norm-${t}.txt" "$eq_only_expected"; then
    shape="eq_only"
  elif cmp -s "/tmp/matrix-norm-${t}.txt" snapshots/matrix_tests_text.txt; then
    shape="text"
  else
    echo "Matrix test-name set for '${t}' matches NEITHER the canonical snapshot, its derived eq-only subset, nor the text shape." >&2
    echo "  vs ordered (snapshots/matrix_tests.txt):" >&2
    diff snapshots/matrix_tests.txt "/tmp/matrix-norm-${t}.txt" >&2 || true
    echo "  vs derived eq-only (ordered minus _ord/order_by/routes_through_ob):" >&2
    diff "$eq_only_expected" "/tmp/matrix-norm-${t}.txt" >&2 || true
    echo "  vs text superset (snapshots/matrix_tests_text.txt):" >&2
    diff snapshots/matrix_tests_text.txt "/tmp/matrix-norm-${t}.txt" >&2 || true
    exit 1
  fi
  echo "  ${t}: ${shape}"
  checked=$((checked + 1))
done <<< "$discovered"
[ "$checked" -gt 0 ] || { echo "No scalar type matched the canonical snapshot, its derived eq-only subset, or the text superset." >&2; exit 1; }

# Completeness cross-check against the catalog (the single source of truth).
catalog=$(cd "{{config_root}}" && cargo run -p eql-codegen -- list-types | LC_ALL=C sort -u)
if [ "$discovered" != "$catalog" ]; then
  echo "Catalog types and matrix-wired types disagree." >&2
  echo "  catalog (eql-codegen list-types): $(echo "$catalog" | tr '\\n' ' ')" >&2
  echo "  matrix-wired (binary --list):     $(echo "$discovered" | tr '\\n' ' ')" >&2
  echo "A catalog type missing its matrix wiring (or a wired type not in the catalog) trips this." >&2
  exit 1
fi

echo "Matrix inventory OK: ${checked} type(s) match the canonical snapshot, its derived eq-only subset, or the committed text superset; catalog reconciled."
"""

[tasks."test:matrix:inventory:jsonb_entry"]
description = "Verify jsonb-entry matrix test-name set against its own snapshot (no scalar catalog cross-check)"
dir = "{{config_root}}/tests/sqlx"
run = """
#!/usr/bin/env bash
# The jsonb-entry behaviour matrix (jsonb_entry_matrix!) is a SIBLING of the
# scalar matrix inventory, NOT folded into it: JsonbEntryInt4 is deliberately
# not a eql-scalars::CATALOG type, so it has no scalars::<T>:: tests and no
# `eql-codegen list-types` row. Its names live under `jsonb_entry::…` and are
# pinned by this isolated snapshot (no catalog cross-check). No database needed.
set -euo pipefail
test -f snapshots/matrix_jsonb_entry_tests.txt || { echo "snapshots/matrix_jsonb_entry_tests.txt missing — regenerate." >&2; exit 1; }
listing=$(cargo test --no-default-features --test encrypted_domain -- --list | sed -n 's/: test$//p')
printf '%s\\n' "$listing" \
  | grep '^jsonb_entry::.*jsonb_entry_int4' \
  | sed -E 's/_int4_/_<T>_/' \
  | LC_ALL=C sort -u > /tmp/matrix-jsonb-entry-current.txt
if ! cmp -s /tmp/matrix-jsonb-entry-current.txt snapshots/matrix_jsonb_entry_tests.txt; then
  echo "JSONB-entry matrix test-name set differs from snapshots/matrix_jsonb_entry_tests.txt." >&2
  diff snapshots/matrix_jsonb_entry_tests.txt /tmp/matrix-jsonb-entry-current.txt >&2 || true
  exit 1
fi
echo "JSONB-entry matrix inventory OK."
"""

[tasks."test:v3-jsonb:inventory"]
description = "Verify the v3 jsonb SQLx test-name inventory snapshot (no database required)"
dir = "{{config_root}}/tests/sqlx"
run = """
#!/usr/bin/env bash
set -euo pipefail

test -f snapshots/v3_jsonb_tests.txt || { echo "snapshots/v3_jsonb_tests.txt missing — regenerate and commit it." >&2; exit 1; }

tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT

cargo test --test v3_jsonb_tests --test v3_jsonb_operator_surface_tests -- --list \
  | sed -n 's/: test$//p' \
  | LC_ALL=C sort > "$tmp"

diff -u snapshots/v3_jsonb_tests.txt "$tmp"
echo "v3 jsonb inventory OK"
"""

[tasks."test:matrix:catalog-coverage"]
description = "Assert every CATALOG (type, domain) has matrix tests, cross-checked against the encrypted_domain binary (no database required)"
dir = "{{config_root}}/tests/sqlx"
run = """
#!/usr/bin/env bash
# Forward catalog-coverage: for each scalar type in the catalog, every domain
# the catalog declares for it must have at least one matrix test name. FINER
# than test:matrix:inventory (which reconciles only TYPES against list-types):
# a DomainSpec added to a catalog row without matrix wiring passes the type
# inventory but fails here. Domain granularity only (Stage 1); per-operator
# execution coverage is the Stage 4 matcher's job. No database needed.
#
# Compile precondition: encrypted_domain include_str!s its fixtures + the
# 001 migration at compile time (mise.toml:104). Those are generated/gitignored,
# so a bare worktree cannot compile it for --list. We never RUN tests here, so
# empty stub files satisfy include_str!. We create only the missing files (rustc
# reports them all in one pass) and remove them on exit. Bash 3.2 compatible
# (macOS): no mapfile/arrays; created stubs are tracked in a temp file.
set -euo pipefail
root="{{config_root}}"

# --- DB-free stub preamble so --list can compile on a bare worktree ----------
created_list=$(mktemp)
trap 'while IFS= read -r f; do [ -n "$f" ] && rm -f "$f"; done < "$created_list"; rm -f "$created_list"' EXIT

err=$(mktemp)
i=0
while :; do
  if listing=$(cargo test --no-default-features --test encrypted_domain -- --list 2>"$err"); then
    break
  fi
  # Missing include_str! targets are the *.sql paths in the compile errors
  # (repo-root-relative, may contain `..`). Match path chars only (no backticks
  # or apostrophes to wrestle through TOML).
  missing=$(grep -oE "[A-Za-z0-9_./-]+\\.sql" "$err" | LC_ALL=C sort -u || true)
  if [ -z "$missing" ]; then
    echo "encrypted_domain failed to list for a non-fixture reason:" >&2
    cat "$err" >&2
    rm -f "$err"; exit 1
  fi
  while IFS= read -r m; do
    [ -n "$m" ] || continue
    p="${root}/${m}"
    if [ ! -e "$p" ]; then
      mkdir -p "$(dirname "$p")"
      : > "$p"
      echo "$p" >> "$created_list"
    fi
  done <<< "$missing"
  i=$((i + 1))
  [ "$i" -lt 12 ] || { echo "stub loop exceeded 12 iterations" >&2; cat "$err" >&2; rm -f "$err"; exit 1; }
done
rm -f "$err"
[ -n "$listing" ] || { echo "No tests listed from the encrypted_domain binary." >&2; exit 1; }
listing=$(printf '%s\\n' "$listing" | sed -n 's/: test$//p')

# --- Catalog surface (overridable for testing via EQL_CATALOG_DUMP_FILE) -----
# The seam lets the fault-injection check (Step 3) run THIS exact loop against a
# doctored dump without editing the task.
if [ -n "${EQL_CATALOG_DUMP_FILE:-}" ]; then
  dump=$(cat "$EQL_CATALOG_DUMP_FILE")
else
  dump=$(cd "$root" && cargo run -q -p eql-codegen -- dump-catalog)
fi

# --- Forward coverage check --------------------------------------------------
failed=0
while IFS= read -r t; do
  [ -n "$t" ] || continue
  # Segments the catalog declares for this type, longest-first so the prefix
  # exclusion below (ord vs ord_ore) is well-defined.
  segments=$(printf '%s' "$dump" \
    | jq -r --arg t "$t" '.types[] | select(.token==$t) | .domains[].segment' \
    | awk '{ print length, $0 }' | LC_ALL=C sort -rn | cut -d" " -f2-)

  while IFS= read -r seg; do
    [ -n "$seg" ] || continue
    # Longer catalog segments having `seg` as a prefix (e.g. ord_ore when seg=ord).
    longer=$(printf '%s\\n' "$segments" | grep -xvF "$seg" | grep -E "^${seg}_" || true)
    # (a) Matrix-shape tests: scalars::<t>::matrix_<t>_<seg>_* . The macro emits
    #     these for the ordered/eq shapes (storage, eq, ord, ord_ore). Strip
    #     longer-prefix tests so seg=ord does not borrow ord_ore's names.
    matches=$(printf '%s\\n' "$listing" | grep -E "^scalars::${t}::matrix_${t}_${seg}_" || true)
    if [ -n "$longer" ]; then
      while IFS= read -r l; do
        [ -n "$l" ] || continue
        matches=$(printf '%s\\n' "$matches" | grep -vE "^scalars::${t}::matrix_${t}_${l}_" || true)
      done <<< "$longer"
    fi
    # (b) Dedicated-module tests: <t>_<seg>::* . Some domains are covered by a
    #     hand-written suite rather than the matrix macro — text's Bloom `_match`
    #     domain (`@>`/`<@` containment) lives in the `text_match` module, since
    #     containment is not an eq/ord shape the matrix emits. The `::` separator
    #     makes this exact per segment, so no longer-prefix exclusion is needed.
    module_matches=$(printf '%s\\n' "$listing" | grep -E "^${t}_${seg}::" || true)
    if [ -z "$(printf '%s' "${matches}${module_matches}" | tr -d '[:space:]')" ]; then
      echo "MISSING: catalog declares domain '${seg}' for type '${t}', but no scalars::${t}::matrix_${t}_${seg}_* or ${t}_${seg}::* test exists." >&2
      failed=1
    fi
  done <<< "$segments"
done < <(printf '%s' "$dump" | jq -r '.types[].token')

if [ "$failed" -ne 0 ]; then
  echo "Catalog-coverage FAILED: a catalog domain has no matrix wiring (see MISSING lines above)." >&2
  exit 1
fi

echo "Catalog-coverage OK: every CATALOG (type, domain) has matrix tests."
"""

[tasks."test:matrix:expand"]
description = "Regenerate the int4 matrix cargo-expand snapshot (requires the pinned nightly + cargo-expand)"
dir = "{{config_root}}/tests/sqlx"
run = """
#!/usr/bin/env bash
# Body-level fidelity backstop for the macro: the expanded source of the int4
# matrix arms. The `cargo +nightly-...` invocation below is the SINGLE source of
# the pinned nightly date — .github/workflows/macro-expand-eql.yml greps it from
# here rather than hardcoding, so there is nothing to keep in lockstep. The date
# is pinned to a known-good value so the snapshot only moves when *the macro*
# moves, not when nightly reformats — bump it deliberately, here, in one place.
#
# `#[sqlx::test]` embeds one `sqlx::migrate::Migration` per file in migrations/
# plus the fixture (via include_str) into EVERY generated test — ~477 MB of
# repeated data dwarfing the macro bodies, and non-deterministic across
# environments (the generated 001_install_eql.sql is absent in a bare checkout).
# Normalise both to fixed empties so the snapshot depends only on matrix.rs +
# the sqlx/test harness: swap migrations/ for a single empty placeholder and
# empty the int4 fixture, expand, then restore (trap fires on any exit). This is
# expand-only surgery on gitignored/generated inputs; nothing here is committed.
#
# Non-blocking lane (no Postgres, never compiled): the `.rs` name lives under
# snapshots/, not tests/, so Cargo never treats it as a test target.
set -euo pipefail
# Force the mise-pinned cargo-expand (mise.toml [tools]) to win over any stray
# global `cargo install cargo-expand` in ~/.cargo/bin, which otherwise sits
# ahead of mise's install dir on PATH and silently drifts the snapshot. The
# version is single-sourced in [tools]; this only fixes PATH precedence.
PATH="$(mise where cargo:cargo-expand)/bin:$PATH"
export PATH
mkdir -p snapshots fixtures
BK=$(mktemp -d)
cp -a migrations "$BK/migrations"
# The int4 fixture is gitignored (regenerated) and absent in a bare checkout —
# back it up only if present, and on restore drop the empty stand-in if so.
HAD_FIXTURE=0
if [ -f fixtures/eql_v2_int4.sql ]; then cp -a fixtures/eql_v2_int4.sql "$BK/eql_v2_int4.sql"; HAD_FIXTURE=1; fi
restore() {
  rm -rf migrations && cp -a "$BK/migrations" migrations
  if [ "$HAD_FIXTURE" = 1 ]; then cp -af "$BK/eql_v2_int4.sql" fixtures/eql_v2_int4.sql; else rm -f fixtures/eql_v2_int4.sql; fi
  rm -rf "$BK"
}
trap restore EXIT
# Wipe + recreate so the expand input is ALWAYS exactly one empty migration +
# one empty fixture, regardless of what the checkout had — this is what makes
# the snapshot deterministic across local and CI.
rm -rf migrations && mkdir migrations
: > migrations/0001_placeholder.sql
: > fixtures/eql_v2_int4.sql
# Expand into a temp file and mv into place only on success — a redirect straight
# onto the snapshot would zero it before cargo runs, so a transient expand
# failure would leave a 0-byte snapshot locally. (Under `set -euo pipefail` a
# cargo failure aborts the script and the trap restores migrations/fixtures; the
# temp file is then orphaned in $TMPDIR, which is acceptable.)
OUT=$(mktemp)
cargo +nightly-2026-05-01 expand --test encrypted_domain scalars::int4 > "$OUT"
mv "$OUT" snapshots/int4_expanded.rs
"""
