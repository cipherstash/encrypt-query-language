[package]
name = "eql-codegen"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eql-domains = { path = "../eql-domains" }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "eql-codegen"
path = "src/main.rs"

[lib]
name = "eql_codegen"
path = "src/lib.rs"

[lints]
workspace = true
