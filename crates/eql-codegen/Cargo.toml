[package]
name = "eql-codegen"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
eql-scalars = { path = "../eql-scalars" }
minijinja = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[[bin]]
name = "eql-codegen"
path = "src/main.rs"

[lib]
name = "eql_codegen"
path = "src/lib.rs"
