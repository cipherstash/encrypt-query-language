[package]
name = "eql-scalars"
version = "0.1.0"
edition = "2021"
description = "Scalar/term catalog for EQL encrypted-domain codegen (std-only, no deps)."

# INTENTIONALLY no dependencies. This crate must stay std-only so the future
# generator (eql-codegen) compiles in ~1-2s and never drags serde/toml onto the
# SQL build's critical path. Do not add deps here.
[dependencies]

[lints]
workspace = true

# Dev-only. proptest is NOT a runtime dependency: it never compiles on the SQL
# build path (eql-codegen depends on eql-scalars' lib, not its tests), so the
# "INTENTIONALLY no dependencies" rule above — which is about build-path deps —
# is preserved. Used by src/proptest_invariants.rs (the catalog suite of
# property tests, no DB, runs in the lean `mise run test:crates` / fork CI path).
[dev-dependencies]
proptest = "1"
