[package]
name = "eql-types"
version = "0.1.0"
edition = "2021"
description = "Canonical wire types for EQL payloads — the single Rust source of truth (TypeScript bindings and JSON Schemas are generated from these types in stacked changes)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Parity oracle: tests/catalog_parity.rs asserts the v3 registry exactly
# covers eql_scalars::CATALOG, so the types here cannot drift from the
# generated SQL surface.
eql-scalars = { path = "../eql-scalars" }
