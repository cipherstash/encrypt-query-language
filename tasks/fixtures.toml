["fixture:generate"]
description = "Generate a SQLx fixture script via cipherstash-client"
# Runs the gated generator for the named fixture. Writes
# tests/sqlx/fixtures/<fixture>.sql. Must run inside the crate — there is no
# root Cargo.toml — matching test:schema / test:sqlx:watch.
#
# Prerequisites:
#   - mise run postgres:up   (Postgres with EQL installed)
#   - CS_* credentials in the shell environment. The generator needs BOTH
#     pairs — they are not alternatives:
#       CS_CLIENT_ACCESS_KEY + CS_WORKSPACE_CRN  ZeroKMS auth (AutoStrategy)
#       CS_CLIENT_ID + CS_CLIENT_KEY             client key (EnvKeyProvider)
#
# Usage: mise run fixture:generate eql_v2_int4
dir = "{{config_root}}/tests/sqlx"
run = """
fixture="{{arg(name="fixture")}}"
# Match the Rust `FixtureIdentifier` rule: `^[a-z][a-z0-9_]*$`. Reject
# empty, leading-digit, and any non-lowercase-alphanumeric-underscore
# input here so the failure mode is a clear shell error rather than a
# Rust panic during the cargo test invocation.
case "$fixture" in
  (''|[0-9]*|*[!a-z0-9_]*) echo "Invalid fixture name: $fixture (expected ^[a-z][a-z0-9_]*$)" >&2; exit 1 ;;
esac

cargo test --features fixture-gen --lib \
  "fixtures::${fixture}::generate" \
  -- --ignored --exact --nocapture
"""

["fixture:generate:all"]
description = "Regenerate every scalar SQLx fixture declared by a type manifest"
# Enumerates tasks/codegen/types/*.toml — the SAME manifests that
# `codegen:domain:all` drives — and regenerates the SQLx fixture for each type
# whose manifest declares a [fixture] table. This keeps the test fixtures in
# lockstep with the declared scalar types: adding a new scalar type (a new
# <T>.toml with a [fixture] table) is picked up automatically, so the test
# task never has to hand-list each fixture. Same prerequisites as
# `fixture:generate` (Postgres up + CS_* credentials).
dir = "{{config_root}}"
run = """
generated=0
for manifest in tasks/codegen/types/*.toml; do
  # Guard the no-match case (glob stays literal under POSIX sh).
  [ -e "$manifest" ] || continue
  # Only types that declare a [fixture] table have a SQLx fixture generator.
  grep -qE '^\\[fixture\\]' "$manifest" || continue
  token=$(basename "$manifest" .toml)
  echo "Generating fixture eql_v2_${token}..."
  mise run fixture:generate "eql_v2_${token}"
  generated=$((generated + 1))
done
if [ "$generated" -eq 0 ]; then
  echo "No scalar manifests with a [fixture] table found in tasks/codegen/types/" >&2
  exit 1
fi
echo "Regenerated ${generated} scalar fixture(s)."
"""
