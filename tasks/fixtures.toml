["fixture:generate"]
description = "Generate a SQLx fixture script via cipherstash-client"
# Runs the gated generator for the named fixture. Writes
# tests/sqlx/fixtures/<fixture>.sql. Must run inside the crate — there is no
# root Cargo.toml — matching test:schema / test:sqlx:watch.
#
# Prerequisites:
#   - mise run postgres:up   (Postgres with EQL installed)
#   - CS_* credentials in the shell environment (auto-loaded by
#     cipherstash-client's AutoStrategy / EnvKeyProvider):
#       CS_CLIENT_ACCESS_KEY + CS_WORKSPACE_CRN  (preferred), OR
#       CS_CLIENT_ID + CS_CLIENT_KEY             (legacy pair)
#
# Usage: mise run fixture:generate eql_v2_int4
dir = "{{config_root}}/tests/sqlx"
run = """
fixture="{{arg(name="fixture")}}"
# Match the Rust `FixtureIdentifier` rule: `^[a-z][a-z0-9_]*$`. Reject
# empty, leading-digit, and any non-lowercase-alphanumeric-underscore
# input here so the failure mode is a clear shell error rather than a
# Rust panic during the cargo test invocation.
case "$fixture" in
  (''|[0-9]*|*[!a-z0-9_]*) echo "Invalid fixture name: $fixture (expected ^[a-z][a-z0-9_]*$)" >&2; exit 1 ;;
esac

cargo test --features fixture-gen --lib \
  "fixtures::${fixture}::generate" \
  -- --ignored --exact --nocapture
"""
