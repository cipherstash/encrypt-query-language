# Encrypted-domain scalar manifest for int4.
# The filename supplies the type token. Each domain lists the index terms
# it carries; term capabilities are fixed in tasks/codegen/terms.py.

[domain]
int4 = []
int4_eq = ["hm"]
int4_ord_ore = ["ore"]
int4_ord = ["ore"]

# Single source of truth for the int4 fixture plaintext list. Drives the
# generated tests/sqlx/src/fixtures/int4_values.rs const, shared by the fixture
# generator and the matrix oracle. Sentinels MIN/MAX/ZERO map to i32 named
# consts; the set MUST include MIN, MAX, and zero (matrix comparison pivots).
[fixture]
values = [
  "MIN", "-100", "-1", "ZERO", "1", "2", "5", "10", "17", "25",
  "42", "50", "100", "250", "1000", "9999", "MAX",
]
